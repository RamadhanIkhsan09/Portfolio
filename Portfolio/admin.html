<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio CMS</title>
<style>
:root{--bg:#f6f3ec;--ink:#14281f;--green:#1d3a2c;--terra:#c0623c;--line:#d9d6ca;--card:#fffdf8;--mut:#5b6b61}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:12px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.top b{margin-right:auto;font-size:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px}
button:hover{border-color:var(--terra)}
.top button.p{background:var(--terra);border-color:var(--terra);color:#fff}
main{max-width:820px;margin:24px auto;padding:0 16px 80px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
summary{padding:14px 18px;font-weight:600;cursor:pointer;text-transform:capitalize}
details>div{padding:4px 18px 18px}
.f{margin-top:12px}
label{display:block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
input,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--terra);border-color:transparent}
.item{border-left:3px solid var(--terra);background:#f4f1e8;border-radius:8px;padding:8px 12px 12px;margin-top:10px}
.bar{display:flex;gap:4px;justify-content:flex-end}.bar button{padding:2px 9px}
.add{margin-top:10px}
#msg{font-size:13px;opacity:.9}
.hint{font-size:13px;color:var(--mut);margin-bottom:16px}
</style>
</head>
<body>
<div class="top">
  <b>Portfolio CMS</b><span id="msg"></span>
  <button id="prev">Preview</button>
  <button id="imp">Import JSON</button>
  <button id="rst">Reset</button>
  <button class="p" id="dl">Download content.json</button>
  <input type="file" id="file" accept=".json" hidden>
</div>
<main>
  <p class="hint">Edit isi di bawah → klik <b>Preview</b> untuk melihat hasilnya → klik <b>Download content.json</b> lalu timpa file <code>content.json</code> di hosting. Draft tersimpan otomatis di browser ini.</p>
  <div id="root"></div>
</main>
<script>
const KEY='portfolio-draft';let data;
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const blank=v=>typeof v==='string'||v==null?'':Array.isArray(v)?[]:Object.fromEntries(Object.entries(v).map(([k,x])=>[k,blank(x)]));
const msg=t=>{const m=document.getElementById('msg');m.textContent=t;setTimeout(()=>m.textContent='',2500)};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
function node(p,k,label){
  const v=p[k],box=el('div','f');
  if(Array.isArray(v)){
    box.append(el('label','',label));const list=el('div'),add=el('button','add','+ Tambah');add.type='button';
    const draw=()=>{list.innerHTML='';v.forEach((it,i)=>{
      const row=el('div','item'),bar=el('div','bar');
      [['↑',-1],['↓',1],['✕',0]].forEach(([t,d])=>{const b=el('button','',t);b.type='button';b.onclick=()=>{
        if(!d){if(!confirm('Hapus item ini?'))return;v.splice(i,1)}else{const j=i+d;if(j<0||j>=v.length)return;[v[i],v[j]]=[v[j],v[i]]}
        save();draw()};bar.append(b)});
      row.append(bar,node(v,i,'#'+(i+1)));list.append(row)})};
    add.onclick=()=>{v.push(blank(v[v.length-1]??''));save();draw()};
    draw();box.append(list,add);
  }else if(v&&typeof v==='object'){
    if(isNaN(label.slice(1)))box.append(el('label','',label));
    Object.keys(v).forEach(x=>box.append(node(v,x,x)));
  }else{
    const long=String(v).length>80||String(v).includes('\n');
    const inp=el(long?'textarea':'input');inp.value=v??'';
    inp.oninput=()=>{p[k]=inp.value;save()};
    if(label[0]!=='#')box.append(el('label','',label));box.append(inp);
  }
  return box;
}
function build(){
  const r=document.getElementById('root');r.innerHTML='';
  Object.keys(data).forEach((k,i)=>{const d=el('details');if(i<2)d.open=true;d.append(el('summary','',k));const c=el('div');
    const v=data[k];if(Array.isArray(v))c.append(node(data,k,k));else Object.keys(v).forEach(x=>c.append(node(v,x,x)));d.append(c);r.append(d)});
}
async function init(){
  try{const s=localStorage.getItem(KEY);if(s)data=JSON.parse(s)}catch(e){}
  if(!data){try{data=await (await fetch('content.json?'+Date.now())).json()}catch(e){alert('content.json tidak bisa dimuat. Jalankan lewat web server atau gunakan Import JSON.');data={}}}
  build();
}
dl.onclick=()=>{const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='content.json';a.click()};
prev.onclick=()=>{save();window.open('index.html?preview=1','_blank')};
imp.onclick=()=>file.click();
file.onchange=async()=>{try{data=JSON.parse(await file.files[0].text());save();build();msg('Diimpor')}catch(e){alert('JSON tidak valid')}};
rst.onclick=async()=>{if(!confirm('Buang draft dan muat ulang dari content.json?'))return;localStorage.removeItem(KEY);data=null;await init();msg('Direset')};
init();
</script>
</body>
</html>
